<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图形控制台 · OCI Pilot</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #bar { height: 40px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: rgba(28,28,30,.92); color: #f5f5f7;
    backdrop-filter: blur(14px) saturate(1.6); font-size: 13px; }
  #bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffd60a; flex: none; }
  #bar .dot.on { background: #30d158; }
  #bar .dot.off { background: #ff453a; }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .sp { flex: 1; }
  #bar button { border: 0; border-radius: 980px; padding: 5px 12px; cursor: pointer;
    background: rgba(255,255,255,.14); color: #f5f5f7; font-size: 12.5px; flex: none; }
  #bar button:hover { background: rgba(255,255,255,.24); }
  #bar button.danger { background: #d70015; }
  #screen { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
  #screen > div { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="bar">
  <span class="dot" id="dot"></span>
  <span id="status">正在建立隧道…</span>
  <span class="sp"></span>
  <button id="btn-cad" title="向实例发送 Ctrl+Alt+Del(Windows 登录/解锁常用)">Ctrl+Alt+Del</button>
  <button id="btn-close" class="danger">断开并关闭</button>
</div>
<div id="screen"></div>
<script type="module">
import RFB from 'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.4.0/core/rfb.js';

const sid = new URLSearchParams(location.search).get('s') || '';
const token = localStorage.getItem('op_token') || '';
const statusEl = document.getElementById('status');
const dotEl = document.getElementById('dot');
function setStatus(text, cls) {
  statusEl.textContent = text;
  dotEl.className = 'dot' + (cls ? ' ' + cls : '');
}

let rfb = null;
if (!sid || !token) {
  setStatus('会话参数缺失, 请从面板的串行控制台页面重新打开', 'off');
} else {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = proto + '//' + location.host + '/api/console/vnc/ws' +
    '?session=' + encodeURIComponent(sid) + '&token=' + encodeURIComponent(token);
  try {
    rfb = new RFB(document.getElementById('screen'), url, {});
    rfb.scaleViewport = true;
    rfb.clipViewport = false;
    rfb.addEventListener('connect', () => setStatus('已连接 · 图形控制台', 'on'));
    rfb.addEventListener('disconnect', (e) => {
      setStatus(e.detail && e.detail.clean ? '已断开' : '连接中断(隧道或实例异常)', 'off');
    });
    rfb.addEventListener('securityfailure', () => setStatus('VNC 安全协商失败', 'off'));
  } catch (err) {
    setStatus('初始化失败: ' + err.message, 'off');
  }
}

document.getElementById('btn-cad').addEventListener('click', () => {
  if (rfb) rfb.sendCtrlAltDel();
});
document.getElementById('btn-close').addEventListener('click', () => {
  if (rfb) { try { rfb.disconnect(); } catch (e) { /* ignore */ } }
  window.close();
});
// 关窗兜底: 通知服务端立即回收会话(WS 断开本身也会触发回收)
window.addEventListener('pagehide', () => {
  if (sid && token) {
    fetch('/api/console/vnc-sessions/' + encodeURIComponent(sid), {
      method: 'DELETE', keepalive: true,
      headers: { 'Authorization': 'Bearer ' + token },
    }).catch(() => {});
  }
});
</script>
</body>
</html>
