# oci-pilot docker compose 一键部署
#
# 用法:
#   1. cp .env.example .env, 填写 TELEGRAM_BOT_TOKEN 和 TELEGRAM_ALLOWED_IDS
#      (必填! 面板登录唯一方式是 Telegram 验证码, 不填谁也登录不了)
#   2. docker compose up -d --build
#   3. 浏览器打开 http://服务器IP:9528
#
# 数据持久化在 ./data 目录 (SQLite + 加密密钥), 重建/升级容器不丢数据。
# 升级: docker compose pull && docker compose up -d --build (本地构建则直接 up -d --build)
services:
  oci-pilot:
    build: .
    image: oci-pilot:latest
    container_name: oci-pilot
    restart: unless-stopped
    ports:
      - "9528:9528"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      # 容器内数据目录固定为 /data (覆盖 .env 里的 OCI_PILOT_DATA)
      OCI_PILOT_DATA: /data
